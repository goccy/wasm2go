name: Release test

# Exercises the release pipeline on every pull request and main push
# without publishing: it validates the GoReleaser configuration and
# runs a publish-free dry-run build, so a broken release is caught on
# the pull request rather than at tag time.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Match the release job: build with the latest stable Go so the
      # GoReleaser dry-run validates against the same toolchain the
      # publish step will use at tag time.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Validate the GoReleaser configuration
        run: make release/check
