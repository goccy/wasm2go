name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository; grant the minimum token scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The test suite uses wat2wasm (from WebAssembly's wabt toolkit)
      # to compile testdata/*.wat fixtures on demand.
      - name: Install wat2wasm
        run: make install/wat2wasm

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test with coverage
        run: make test-cover

  # The default job (amd64 at GOAMD64=v1) executes only the PURE
  # fallback: the amd64 splices compile into v2+ binaries and the
  # arm64 splices need arm64 hardware. These jobs run the
  # execution-heavy suites on each spliced backend — the gates that
  # would have caught the const-shuffle scratch clobber before
  # release. internal/codegen is deliberately absent from both: its
  # runtime tests build codegen.Translate output, which by design
  # carries the pure bodies under the asm-dormancy tag with no asm
  # bundle — only the full transpile backend produces packages that
  # run on the spliced targets.
  test-amd64-v2:
    runs-on: ubuntu-latest
    env:
      GOAMD64: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wat2wasm
        run: make install/wat2wasm

      - name: Test with the amd64 splices enabled
        run: go test -count=1 ./transpile/... ./internal/gcasm/...

  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wat2wasm
        run: make install/wat2wasm

      - name: Test with the arm64 splices enabled
        run: go test -count=1 ./transpile/... ./internal/gcasm/...

  # Consumer-link gate on the production bundle shape: transpile the
  # pinned goccy/llama-wasm release wasm with llama-wasm's own options
  # and LINK a consumer for linux/arm64, linux/amd64 (GOAMD64=v2) and
  # linux/amd64 (GOAMD64=v1). Package builds alone never run the
  # linker's nosplit/ABI-wrapper resolution; a multi-chunk bundle once
  # compiled everywhere and linked nowhere, and was only caught four
  # releases downstream. See `make llama-bundle-link`.
  llama-bundle-link:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The gcasm capture compiles the chunk packages (each a multi-
      # hundred-thousand-line generated file) with the gc toolchain; in
      # parallel they exhaust the runner's memory and the step is
      # terminated (exit 143). Serialize the package builds and cap the
      # Go heap of every compiler / wasm2go process.
      GOFLAGS: -p=1
      GOMEMLIMIT: 6GiB
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Resource trace: the first runs of this job were SIGTERMed (exit
      # 143) four minutes in with no message; sample memory and disk so
      # the next termination has a cause attached.
      - name: Start resource sampler
        run: |
          ( while true; do
              printf '%s ' "$(date -u +%H:%M:%S)"; free -m | awk '/Mem:/ {printf "mem used=%sM avail=%sM ", $3, $7}'; \
              df -m /tmp / | awk 'NR>1 {printf "%s avail=%sM ", $6, $4}'; \
              ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<=4 {printf "%s=%dM ", $2, $1/1024}'; echo
              sleep 10
            done ) > "$RUNNER_TEMP/resources.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"

      - name: Transpile the pinned llama.wasm and link a consumer per target
        run: make llama-bundle-link

      - name: Resource trace
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid")" 2>/dev/null || true
          tail -n 60 "$RUNNER_TEMP/resources.log" || true
          dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -n 5 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # golangci-lint is a tools/go.mod tool; install the Go version
      # that module pins so `go tool -modfile=tools/go.mod` can build it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Lint
        run: make lint
