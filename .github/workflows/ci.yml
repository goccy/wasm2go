name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository; grant the minimum token scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The test suite uses wat2wasm (from WebAssembly's wabt toolkit)
      # to compile testdata/*.wat fixtures on demand.
      - name: Install wat2wasm
        run: make install/wat2wasm

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test with coverage
        run: make test-cover

  # The amd64 SIMD splices only compile into GOAMD64=v2+ binaries
  # (v1 keeps the pure fallback), so the default job never EXECUTES
  # them. This job runs the execution-heavy suites with the splices
  # live on the runner's AVX2 hardware — the gate that would have
  # caught the const-shuffle scratch clobber before release.
  test-amd64-v2:
    runs-on: ubuntu-latest
    env:
      GOAMD64: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wat2wasm
        run: make install/wat2wasm

      - name: Test with the amd64 splices enabled
        run: go test -count=1 ./transpile/... ./internal/gcasm/... ./internal/codegen/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # golangci-lint is a tools/go.mod tool; install the Go version
      # that module pins so `go tool -modfile=tools/go.mod` can build it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Lint
        run: make lint
